<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Alpha Company is launching soon.">
  <title>Alpha Company — Launching Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --surface: #101010;
      --border: #2a2a2a;
      --white: #ffffff;
      --secondary: #c7c7c7;
      --muted: #8d8d8d;
      --blue: #3b82f6;
      --blue-hover: #60a5fa;
      --mono: "JetBrains Mono", monospace;
      --sans: "Space Grotesk", "Inter", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body { min-height: 100svh; color: var(--white); font-family: var(--sans); overflow: hidden; }
    button { font: inherit; }
    .page {
      isolation: isolate;
      position: relative;
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      padding: 80px 24px 72px;
      background: radial-gradient(ellipse at 50% 46%, rgba(59,130,246,.095), transparent 37%), var(--bg);
    }
    .page::before, .page::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: min(62vw, 720px);
      aspect-ratio: 1;
      border: 1px solid rgba(59,130,246,.12);
      border-radius: 50%;
      pointer-events: none;
      animation: drift 28s ease-in-out infinite alternate;
    }
    .page::before { left: -32%; top: -52%; box-shadow: 0 0 100px rgba(59,130,246,.035), inset 0 0 100px rgba(59,130,246,.025); }
    .page::after { right: -35%; bottom: -60%; width: min(72vw, 820px); animation-delay: -12s; animation-direction: alternate-reverse; }
    .glow {
      position: absolute;
      z-index: -1;
      width: min(55vw, 620px);
      height: 220px;
      top: 45%; left: 50%; transform: translate(-50%, -50%);
      border-radius: 50%; background: rgba(37,99,235,.09); filter: blur(95px);
      pointer-events: none; animation: breathe 8s ease-in-out infinite;
    }
    .grain {
      position: absolute; inset: 0; z-index: -1; opacity: .025; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");
    }
    .content {
      width: min(100%, 1000px); display: flex; flex-direction: column; align-items: center;
      text-align: center; animation: enter 1.15s cubic-bezier(.2,.7,.2,1) both;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 10px; margin: 0 0 clamp(38px, 7vh, 68px);
      color: var(--muted); font: 500 10px/1.4 var(--mono); letter-spacing: .22em; text-transform: uppercase;
    }
    .signal { position: relative; width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 12px rgba(59,130,246,.7); }
    .signal::after { content: ""; position: absolute; inset: -4px; border: 1px solid rgba(59,130,246,.55); border-radius: 50%; animation: ping 2.6s ease-out infinite; }
    .logo-wrap {
      position: relative; width: min(82vw, 780px); margin: 0 auto clamp(42px, 7vh, 70px);
      filter: drop-shadow(0 10px 22px rgba(0,0,0,.55)) drop-shadow(0 0 28px rgba(59,130,246,.13));
      animation: logo-settle 1.4s .1s cubic-bezier(.2,.7,.2,1) both;
    }
    .logo-wrap::before { content: ""; position: absolute; z-index: -1; inset: 18% 12% 2%; border-radius: 50%; background: rgba(59,130,246,.12); filter: blur(48px); }
    .logo { display: block; width: 100%; height: auto; object-fit: contain; }
    .launch {
      margin: 0; font-size: clamp(30px, 5vw, 52px); font-weight: 500; letter-spacing: -.055em; line-height: 1.05;
    }
    .launch span { color: var(--blue); }
    .bottom-line { display: flex; align-items: center; gap: 14px; margin-top: 27px; color: var(--muted); font: 400 10px/1.5 var(--mono); letter-spacing: .16em; text-transform: uppercase; }
    .bottom-line::before, .bottom-line::after { content: ""; width: 30px; height: 1px; background: var(--border); }
    .sound {
      position: fixed; top: 24px; right: 26px; z-index: 5; display: inline-flex; align-items: center; gap: 10px;
      min-height: 38px; padding: 0 13px; border: 1px solid var(--border); border-radius: 6px;
      background: rgba(16,16,16,.8); color: var(--secondary); font: 500 10px/1 var(--mono); letter-spacing: .09em;
      text-transform: uppercase; cursor: pointer; transition: border-color .2s, color .2s, background .2s;
      backdrop-filter: blur(12px);
    }
    .sound:hover { border-color: rgba(59,130,246,.65); color: var(--white); background: #101010; }
    .sound:focus-visible { outline: 2px solid var(--blue-hover); outline-offset: 4px; }
    .bars { display: flex; align-items: center; gap: 2px; height: 12px; }
    .bars i { display: block; width: 2px; height: 4px; border-radius: 2px; background: var(--blue); }
    .sound[aria-pressed="true"] .bars i { animation: equalize .8s ease-in-out infinite alternate; }
    .sound[aria-pressed="true"] .bars i:nth-child(2) { animation-delay: .2s; }
    .sound[aria-pressed="true"] .bars i:nth-child(3) { animation-delay: .4s; }
    .sound[aria-pressed="true"] .bars i:nth-child(4) { animation-delay: .1s; }
    .footer { position: absolute; bottom: 22px; left: 26px; right: 26px; display: flex; justify-content: space-between; gap: 16px; color: #666; font: 400 9px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    .footer span:last-child { color: #777; }
    @keyframes enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes logo-settle { from { opacity: 0; transform: scale(.965); } to { opacity: 1; transform: scale(1); } }
    @keyframes ping { 0% { transform: scale(.65); opacity: .75; } 100% { transform: scale(2.8); opacity: 0; } }
    @keyframes breathe { 0%,100% { opacity: .55; transform: translate(-50%,-50%) scale(.9); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.12); } }
    @keyframes drift { from { transform: translate3d(-12px, 8px, 0) rotate(-8deg); } to { transform: translate3d(18px, -12px, 0) rotate(8deg); } }
    @keyframes equalize { from { height: 3px; } to { height: 12px; } }
    @media (max-width: 600px) {
      .page { padding: 76px 20px 70px; }
      .eyebrow { margin-bottom: 42px; font-size: 9px; letter-spacing: .16em; }
      .logo-wrap { width: min(94vw, 520px); margin-bottom: 43px; }
      .launch { font-size: clamp(30px, 8vw, 42px); }
      .bottom-line { margin-top: 22px; font-size: 9px; letter-spacing: .1em; }
      .sound { top: 15px; right: 15px; min-height: 35px; }
      .footer { bottom: 14px; left: 15px; right: 15px; font-size: 8px; letter-spacing: .04em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

  <script>
    (() => {
      const button = document.getElementById('soundToggle');
      const label = document.getElementById('soundLabel');
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      let context, master, voices = [], timers = [], isPlaying = false;
      const chords = [
        [174.61, 220, 261.63, 329.63],
        [146.83, 196, 220, 293.66],
        [164.81, 207.65, 246.94, 329.63],
        [130.81, 196, 220, 261.63]
      ];
      let chordIndex = 0;

      function updateButton(playing) {
        button.setAttribute('aria-pressed', String(playing));
        button.setAttribute('aria-label', playing ? 'Mute ambient sound' : 'Enable ambient sound');
        label.textContent = playing ? 'Sound on' : 'Sound off';
      }

      function voice(freq, gainValue, type = 'sine', detune = 0) {
        const osc = context.createOscillator();
        const gain = context.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.detune.value = detune;
        gain.gain.value = gainValue;
        osc.connect(gain);
        gain.connect(master);
        osc.start();
        voices.push(osc, gain);
      }

      function playChord() {
        if (!isPlaying || !context || !master) return;
        const now = context.currentTime;
        const chord = chords[chordIndex++ % chords.length];
        chord.forEach((freq, i) => {
          const osc = context.createOscillator();
          const gain = context.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          osc.detune.value = i % 2 ? -3 : 3;
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(i === 0 ? 0.018 : 0.011, now + 2.5);
          gain.gain.setTargetAtTime(0.0001, now + 7, 2.5);
          osc.connect(gain);
          gain.connect(master);
          osc.start(now);
          osc.stop(now + 15);
        });
      }

      async function startSound() {
        if (!AudioCtx) { label.textContent = 'Audio unavailable'; return; }
        try {
          if (!context) {
            context = new AudioCtx();
            master = context.createGain();
            master.gain.value = 0.0001;
            master.connect(context.destination);
            // Low, soft tones with slow fades: no external audio file needed.
            voice(55, 0.12, 'sine', -2);
            voice(82.41, 0.035, 'sine', 2);
          }
          await context.resume();
          // Autoplay may be blocked until a deliberate user gesture.
          if (context.state !== 'running') {
            isPlaying = false;
            updateButton(false);
            return;
          }
          isPlaying = true;
          master.gain.cancelScheduledValues(context.currentTime);
          master.gain.setTargetAtTime(0.7, context.currentTime, 1.8);
          playChord();
          timers.push(setInterval(playChord, 8500));
          updateButton(true);
        } catch (_) {
          isPlaying = false;
          updateButton(false);
        }
      }

      function stopSound() {
        isPlaying = false;
        timers.forEach(clearInterval);
        timers = [];
        if (context && master) master.gain.setTargetAtTime(0.0001, context.currentTime, 0.18);
        updateButton(false);
      }

      button.addEventListener('click', () => isPlaying ? stopSound() : startSound());

      // Attempt autoplay on arrival. Browsers that block audible autoplay leave the
      // sound control available; the first user click can start it immediately.
      window.addEventListener('load', () => {
        startSound().catch(() => updateButton(false));
      }, { once: true });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && isPlaying && context) context.suspend();
        else if (!document.hidden && isPlaying && context) context.resume();
      });
    })();
  </script>
</body>
</html>
